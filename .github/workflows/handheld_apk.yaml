# Builds an installable TizenTube Cobalt APK for handhelds.
#
# The repo's existing android_27.lts.yaml delegates to main.yaml, which targets
# Google's self-hosted `chrobalt-linux-runner` fleet and builds through their RBE
# instance. A fork has neither, so this workflow is a standalone, self-contained
# path from a bare Linux runner to a signed APK artifact.
#
# Build size warning: this compiles Chromium from source with no remote execution.
# Expect roughly 50-70 GB of disk and, more importantly, a wall time that scales
# with core count. GitHub's standard 4-core `ubuntu-latest` runner will not finish
# inside the hard 6-hour job limit; use a larger GitHub-hosted runner or a
# self-hosted one via the `runner` input.

name: handheld_apk

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform.'
        required: true
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x86
        default: android-arm64
      build_config:
        description: 'Build config. devel builds fastest; qa and gold are official builds and take considerably longer.'
        required: true
        type: choice
        options:
          - devel
          - qa
          - gold
        default: devel
      runner:
        description: 'Runner label(s). The 4-core ubuntu-latest cannot finish within the 6-hour job limit; point this at a larger or self-hosted runner.'
        required: true
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: 'Job timeout. GitHub-hosted runners are capped at 360 no matter what is set here; self-hosted runners can go far higher, which is the only way a from-scratch build finishes.'
        required: false
        type: string
        default: '360'
      enable_sccache:
        description: 'Cache compiler output in the GitHub Actions cache. Pointless on a self-hosted runner, where the out/ directory already persists between runs.'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a build in flight. A multi-hour job must not be killed because
  # something else touched the branch while it was running.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.platform }}_${{ inputs.build_config }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      # gclient checks for updates on every invocation otherwise, which is noise in CI.
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      OUT_DIR: out/${{ inputs.platform }}_${{ inputs.build_config }}

    steps:
      - name: Preflight
        shell: bash
        run: |
          set -e
          cores=$(nproc)
          ram_gb=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          echo "Runner: ${{ runner.environment }} | cores: ${cores} | RAM: ${ram_gb} GB"
          df -h .

          # Fail now rather than four hours from now with a bare ENOSPC.
          if ! command -v sudo >/dev/null 2>&1; then
            echo "::error::sudo is required to install build dependencies."
            exit 1
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "::error::sudo needs a password. Give the runner user passwordless sudo (NOPASSWD in /etc/sudoers.d) or the dependency install will hang forever waiting on a prompt nobody is there to answer."
            exit 1
          fi
          if [[ "${ram_gb}" -lt 8 ]]; then
            echo "::error::Only ${ram_gb} GB RAM. Linking Chromium needs several GB per link job and will be OOM-killed below 8 GB. On WSL2, raise the memory limit in %UserProfile%\\.wslconfig."
            exit 1
          fi

          # A rough guide to how long this will take, so a doomed run is obvious
          # from the first few seconds of the log rather than at the timeout.
          echo "::notice::Estimated build time at ${cores} cores: roughly $(( 32 / (cores > 0 ? cores : 1) )) to $(( 64 / (cores > 0 ? cores : 1) )) hours from cold."
          if [[ "${{ runner.environment }}" == "github-hosted" && "${cores}" -le 4 ]]; then
            echo "::warning::A ${cores}-core hosted runner cannot finish a cold Chromium build inside GitHub's hard 6-hour job limit. This run will validate sync, hooks and gn gen, then be killed mid-compile."
          fi

      - name: Check free disk
        shell: bash
        run: |
          set -e
          avail_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "Free disk on the workspace volume: ${avail_gb} GB"
          # Source plus synced deps is roughly 40 GB, build output another 20-40 GB.
          if [[ "${avail_gb}" -lt 40 ]]; then
            echo "::error::${avail_gb} GB free is not enough to even finish syncing. Need 100 GB or more for a comfortable build."
            exit 1
          fi
          if [[ "${avail_gb}" -lt 100 ]]; then
            echo "::warning::${avail_gb} GB free. A cold build wants 100 GB or more; this may run out of disk during linking."
          fi

      - name: Reclaim disk space
        # Only meaningful on GitHub's images, which ship toolchains this build has
        # no use for. On a self-hosted runner these paths are somebody's system.
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -x
          df -h /
          # The hosted image ships several toolchains this build has no use for.
          # Removing them buys back roughly 25 GB, which the Chromium checkout and
          # its build output need.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gclient is configured below with --name=src, so the tree has to live at
          # <workspace>/cobalt/src with the .gclient file one level above it.
          path: cobalt/src
          fetch-depth: 1
          # Do not git-clean the workspace. out/ is untracked, so cleaning would
          # throw away every object file from a previous attempt; leaving it means
          # a re-run after a timeout or a transient failure resumes where it left
          # off instead of starting from zero. Only matters on a self-hosted
          # runner, where the workspace survives between runs.
          clean: false

      - name: Clone depot_tools
        shell: bash
        run: |
          set -ex
          # Re-runs on a self-hosted runner already have it.
          if [[ ! -d "${GITHUB_WORKSPACE}/cobalt/depot_tools/.git" ]]; then
            rm -rf "${GITHUB_WORKSPACE}/cobalt/depot_tools"
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "${GITHUB_WORKSPACE}/cobalt/depot_tools"
          fi
          echo "${GITHUB_WORKSPACE}/cobalt/depot_tools" >> "${GITHUB_PATH}"

      - name: Bootstrap depot_tools python
        shell: bash
        run: |
          set -ex
          # DEPOT_TOOLS_UPDATE=0 skips the implicit bootstrap, so do it by hand.
          source "${GITHUB_WORKSPACE}/cobalt/depot_tools/bootstrap_python3" && bootstrap_python3
          build_telemetry opt-out || true

      - name: Configure gclient
        shell: bash
        env:
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt"
          # Idempotent, so a re-run on a self-hosted runner does not clobber a
          # good .gclient with a duplicate target_os line.
          if [[ ! -f .gclient ]]; then
            gclient config --name=src "${REPOSITORY}"
          fi
          if ! grep -q "target_os" .gclient; then
            echo "target_os=['android']" >> .gclient
          fi
          gclient validate

      - name: Sync dependencies
        shell: bash
        env:
          REF: ${{ github.sha }}
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt"
          # --no-history and --shallow keep this to the tens of GB rather than
          # hundreds. Hooks run separately below so a sync failure is easy to tell
          # apart from a hook failure.
          gclient sync \
            --verbose \
            --shallow \
            --no-history \
            --nohooks \
            --force \
            --delete_unversioned_trees \
            --revision "${REF}"
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt/src"
          # --unsupported keeps this working when the runner image moves to an
          # Ubuntu release the script does not yet know about.
          sudo python3 build/install-build-deps.py --no-prompt --unsupported

      - name: Run hooks
        shell: bash
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt"
          gclient runhooks --verbose
          df -h /

      - name: Set up sccache
        if: inputs.enable_sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache GitHub Actions backend
        if: inputs.enable_sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "${GITHUB_ENV}"

      - name: GN gen
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_CONFIG: ${{ inputs.build_config }}
          ENABLE_SCCACHE: ${{ inputs.enable_sccache }}
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt/src"
          gn_flags=(--no-rbe)
          if [[ "${ENABLE_SCCACHE}" == "true" ]]; then
            gn_flags+=(--use-sccache)
          fi
          # --no-rbe is what makes this buildable outside Google's RBE instance: it
          # leaves use_remoteexec and use_siso unset, so autoninja runs plain local
          # ninja.
          cobalt/build/gn.py -p "${PLATFORM}" -C "${BUILD_CONFIG}" "${gn_flags[@]}"
          gn args --list --short --overrides-only "${OUT_DIR}"

      - name: Build APK
        shell: bash
        run: |
          set -ex
          cd "${GITHUB_WORKSPACE}/cobalt/src"
          # Only the APK, not cobalt:gn_all: the CI default pulls in every test
          # binary in the tree and multiplies both build time and disk use.
          time autoninja -C "${OUT_DIR}" cobalt/android:cobalt_apk
          df -h /

      - name: Show sccache stats
        if: inputs.enable_sccache
        shell: bash
        run: sccache --show-stats || true

      - name: Report build output
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/cobalt/src"
          ls -la "${OUT_DIR}/apks" || true
          apk=$(find "${OUT_DIR}/apks" -name '*.apk' | head -1)
          if [[ -z "${apk}" ]]; then
            echo "::error::Build reported success but produced no APK under ${OUT_DIR}/apks."
            exit 1
          fi
          echo "::notice::Built $(basename "${apk}") ($(du -h "${apk}" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-handheld-${{ inputs.platform }}-${{ inputs.build_config }}
          if-no-files-found: error
          path: |
            cobalt/src/${{ env.OUT_DIR }}/apks/*.apk
            cobalt/src/${{ env.OUT_DIR }}/*_apk/*.apk
